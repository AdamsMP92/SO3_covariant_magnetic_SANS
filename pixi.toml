[workspace]
name = "so3-covariant-magnetic-sans"
version = "0.1.0"
description = "Reproducible figures for SO(3)-covariant powder-averaged magnetic SANS"
authors = ["Michael P. Adams"]
channels = ["conda-forge"]
channel-priority = "strict"
platforms = ["osx-arm64", "linux-64"]

[tasks]
check = "python python/check_affine_pair.py"
test = { cmd = "python -m pytest -q tests", env = { PYTHONPATH = "python", OPENBLAS_NUM_THREADS = "2", OMP_NUM_THREADS = "2" } }
data = { cmd = "python -m models.build_data", env = { PYTHONPATH = "python", OPENBLAS_NUM_THREADS = "2", OMP_NUM_THREADS = "2" } }
kernel = "python -m ipykernel install --user --name so3_covariant_magnetic_sans --display-name 'Python 3.11 (Pixi: so3-covariant-magnetic-sans)'"
notebook = { cmd = "jupyter lab notebooks/inspect_data.ipynb", depends-on = ["kernel"] }
fig1 = { cmd = "python python/fig_vortex_p4.py --output-dir output", depends-on = ["data"] }
fig2 = { cmd = "python python/fig_affine_pair.py --output-dir output", depends-on = ["data"] }

[dependencies]
python = "3.11.*"
numpy = "==1.26.4"
matplotlib = "==3.10.8"
pillow = "==11.3.0"
pyvista = "==0.46.5"
poppler = "==25.12.0"
pytest = ">=8,<10"
jupyterlab = ">=4,<5"
scipy = ">=1.15,<2"
trame = ">=4.0.0,<5"
trame-vtk = ">=2.11.17,<3"
trame-vuetify = ">=3.3.0,<4"
ipywidgets = ">=8.1.9,<9"
nest-asyncio = ">=1.6.0,<2"
jupyter-server-proxy = ">=4.6.0,<5"

[pypi-dependencies]
paperfig = { git = "https://github.com/AdamsMP92/paperfig.git", rev = "9a70e7800d2ea520d4055807fe7da1bd00647fd9" }
mammos-entity = "==0.13.0"
