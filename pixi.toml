[workspace]
name = "so3-covariant-magnetic-sans"
version = "0.1.0"
description = "Reproducible figures for SO(3)-covariant powder-averaged magnetic SANS"
authors = ["Michael P. Adams"]
channels = ["conda-forge"]
channel-priority = "strict"
platforms = ["osx-arm64", "linux-64"]

[tasks]
check = "python python/check_affine_pair.py"
test = "pytest -q tests"
data = "python python/export_figure_data.py --output output/data/SO3_covariant_magnetic_SANS.h5"
fig1 = "python python/fig_vortex_p4.py --output-dir output"
fig2 = "python python/fig_affine_pair.py --output-dir output"

[dependencies]
python = "3.11.*"
numpy = "==1.26.4"
matplotlib = "==3.10.8"
pillow = "==11.3.0"
pyvista = "==0.46.5"
poppler = "==25.12.0"
pytest = ">=8,<10"

[pypi-dependencies]
paperfig = { git = "https://github.com/AdamsMP92/paperfig.git", rev = "9a70e7800d2ea520d4055807fe7da1bd00647fd9" }
mammos-entity = "==0.13.0"
